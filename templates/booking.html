<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約 - {{ movie.title }}</title>
    <style>
        /* --- 共通設定 --- */
        body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f2f5; color: #333; padding-bottom: 120px; /* フッターの分だけ余白を空ける */ }
        
        /* コンテナ */
        .container { max-width: 800px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
        
        /* ヘッダー */
        .header { background: #fff; padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .movie-title { margin: 0; font-size: 1.2rem; }
        .close-btn { cursor: pointer; font-size: 1.5rem; color: #999; text-decoration: none; }

        /* ステップ表示エリア */
        .step-content { display: none; padding: 30px; animation: fadeIn 0.3s ease; }
        .step-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-bottom: 30px; font-size: 1.1rem; color: #555; }

        /* --- STEP 1: 日時選択 --- */
        .calendar-wrapper { margin-bottom: 30px; background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: bold; font-size: 1.1rem; }
        
        .cal-nav-btn { background: none; border: 1px solid #ddd; border-radius: 50%; width: 30px; height: 30px; cursor: pointer; color: #555; display: flex; justify-content: center; align-items: center; transition: 0.2s; }
        .cal-nav-btn:hover:not(:disabled) { background-color: #333; color: #fff; border-color: #333; }
        .cal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; background: none; color: #ccc; border-color: #eee; }

        .calendar-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.85rem; color: #666; margin-bottom: 5px; font-weight: bold; }
        .weekday:first-child { color: #e74c3c; }
        .weekday:last-child { color: #3498db; }

        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-cell { padding: 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; position: relative; }
        .cal-cell:hover:not(.empty):not(.disabled) { background: #e0e0e0; }
        .cal-cell.selected { background: #333; color: #fff; }
        .cal-cell.disabled { background: #eee; color: #bbb; cursor: not-allowed; pointer-events: none; }
        .cal-cell.empty { cursor: default; }

        .time-list { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .time-btn { display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100px; height: 80px; border: 2px solid #ddd; background: #fff; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .time-btn:hover { border-color: #999; }
        .time-btn.selected { border-color: #007bff; color: #007bff; background: #e6f0ff; }
        .t-start { font-size: 1.2rem; font-weight: bold; line-height: 1.2; }
        .t-end { font-size: 0.85rem; color: #666; margin-top: 4px; }
        .time-btn.selected .t-end { color: #007bff; }

        /* --- STEP 2: 座席選択 --- */
        .screen { height: 30px; background: #ccc; margin-bottom: 40px; border-radius: 4px; text-align: center; color: #fff; line-height: 30px; font-size: 0.8rem; letter-spacing: 5px; }
        .seat-map { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-width: 500px; margin: 0 auto; }
        .seat { aspect-ratio: 1; background: #e0e0e0; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .seat:hover { background: #d0d0d0; transform: scale(1.05); }
        .seat.selected { background: #4cd137; box-shadow: 0 0 10px rgba(76, 209, 55, 0.4); }
        
        .seat-slots-container { display: flex; justify-content: center; gap: 15px; margin-top: 30px; margin-bottom: 20px; }
        .seat-slot-card { width: 100px; height: 80px; border: 2px solid #ddd; border-radius: 8px; background: #fff; color: #ccc; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.1rem; transition: 0.2s; }
        .seat-slot-card.filled { background-color: #4cd137; border-color: #4cd137; color: #fff; box-shadow: 0 4px 10px rgba(76, 209, 55, 0.3); transform: translateY(-2px); }

        /* --- STEP 3: 入力 & 計算 --- */
        .ticket-form-list { display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .ticket-card { display: flex; align-items: center; background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 5px solid #4cd137; gap: 20px; }
        .seat-badge { width: 60px; height: 60px; background: #fff; border: 2px solid #4cd137; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; color: #4cd137; }
        
        .form-group { flex: 1; }
        .form-row { display: flex; gap: 15px; margin-bottom: 10px; }
        .form-row:last-child { margin-bottom: 0; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
        
        /* クーポンエリア（スクロール内） */
        .coupon-area { background: #f9f9f9; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .coupon-row { display: flex; gap: 10px; }
        .coupon-btn { 
            background: #636e72; 
            color: #fff; 
            border: none; 
            padding: 0 20px; 
            border-radius: 6px; 
            cursor: pointer;
            
            /* ▼▼▼ 追加設定 ▼▼▼ */
            white-space: nowrap; /* 文字を折り返さない */
            flex-shrink: 0;      /* 横幅が狭くなってもボタンを縮めない */
        }

        /* エラーメッセージ */
        .error-msg { color: #ff7675; font-size: 0.9rem; text-align: center; margin-top: 10px; display: none; font-weight: bold; }

        /* ナビゲーションボタン */
        .nav-area { display: flex; justify-content: center; gap: 20px; padding: 30px; border-top: 1px solid #eee; }
        .btn { padding: 12px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .btn-prev { background: #dfe6e9; color: #2d3436; }
        .btn-next { background: #2d3436; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        /* --- ★修正: 画面下部固定フッター --- */
        .fixed-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #2d3436; /* ダークグレー */
            color: #fff;
            padding: 15px 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
            z-index: 1000;
            display: none; /* 初期状態は非表示(Step3で表示) */
            justify-content: center;
            align-items: center;
            gap: 40px;
        }
        
        .footer-total { font-size: 1rem; display: flex; flex-direction: column; align-items: flex-start; }
        .footer-price { font-size: 1.8rem; font-weight: bold; color: #55efc4; }
        .footer-discount { font-size: 0.8rem; color: #b2bec3; }
        
        .footer-actions { display: flex; gap: 15px; }
        .btn-footer-back { background: #636e72; color: #fff; }
        .btn-footer-submit { background: #00b894; color: #fff; font-size: 1.1rem; padding: 12px 50px; }
        .btn-footer-submit:hover:not(:disabled) { background: #00a884; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0,255,170,0.3); }

    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1 class="movie-title">予約: {{ movie.title }}</h1>
            <a href="/" class="close-btn">×</a>
        </div>

        <!-- STEP 1: 日時選択 -->
        <div id="step1" class="step-content active">
            <h2>日付をお選びください</h2>
            <div class="calendar-wrapper">
                <div class="calendar-header">
                    <button class="cal-nav-btn" id="btnPrevMonth" onclick="changeMonth(-1)">&#10094;</button>
                    <span id="calMonth"></span>
                    <button class="cal-nav-btn" id="btnNextMonth" onclick="changeMonth(1)">&#10095;</button>
                </div>
                
                <div class="calendar-weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>
                </div>

                <div class="calendar-grid" id="calGrid">
                    <!-- JSで生成 -->
                </div>
            </div>

            <h2>時間をお選びください</h2>
            <div class="time-list">
                {% for time in movie.start_time %}
                <div class="time-btn" 
                     onclick="selectTime(this, '{{ time }}')"
                     data-start="{{ time }}" 
                     data-duration="{{ movie.duration }}">
                    <span class="t-start">{{ time }}</span>
                    <span class="t-end"></span> 
                </div>
                {% endfor %}
            </div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="location.href='/'">戻る</button>
                <button class="btn btn-next" id="btnStep1" disabled onclick="goStep(2)">次の画面へ</button>
            </div>
        </div>

        <!-- STEP 2: 座席選択 -->
        <div id="step2" class="step-content">
            <h2>座席をお選びください（最大4席）</h2>
            <div class="screen">SCREEN</div>
            <div class="seat-map" id="seatMap">
                <!-- JSで生成 -->
            </div>
            <div class="seat-slots-container">
                <div class="seat-slot-card" id="seat-slot-0">未選択</div>
                <div class="seat-slot-card" id="seat-slot-1">未選択</div>
                <div class="seat-slot-card" id="seat-slot-2">未選択</div>
                <div class="seat-slot-card" id="seat-slot-3">未選択</div>
            </div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="goStep(1)">前の画面に戻る</button>
                <button class="btn btn-next" id="btnStep2" disabled onclick="goStep(3)">次の画面へ</button>
            </div>
        </div>

        <!-- STEP 3: 券種入力 -->
        <div id="step3" class="step-content">
            <h2>券種を入力してください</h2>
            
            <div id="passengerForms" class="ticket-form-list">
                <!-- JSで動的にフォーム生成 -->
            </div>

            <!-- クーポンエリア（スクロール内） -->
            <div class="coupon-area">
                <div class="coupon-row">
                    <input type="text" id="couponInput" placeholder="クーポンコードをお持ちの方はこちら">
                    <button class="coupon-btn" onclick="calcTotal()">適用</button>
                </div>
                <div class="error-msg" id="errorMsg"></div>
            </div>
            
            <!-- 通常のナビゲーションは隠す（フッターに出すため） -->
        </div>
    </div>

    <!-- ★修正: 画面下部固定フッター (STEP3用) -->
    <div id="fixedFooter" class="fixed-footer">
        <div class="footer-total">
            <span>お支払い合計</span>
            <span class="footer-price" id="totalPriceDisplay">¥0</span>
            <span class="footer-discount" id="discountDisplay"></span>
        </div>
        <div class="footer-actions">
            <button class="btn btn-footer-back" onclick="goStep(2)">戻る</button>
            <button class="btn btn-footer-submit" id="btnSubmit" onclick="submitOrder()">予約確定</button>
        </div>
    </div>

    <!-- 送信用隠しフォーム -->
    <form id="finalForm" action="/result" method="post" style="display:none;">
        <input type="hidden" name="movie_id" value="{{ movie.id }}">
        <input type="hidden" name="date" id="postDate">
        <input type="hidden" name="seat" id="postSeat">
    </form>

    <script>
        // --- データ保持用 ---
        let bookingData = {
            date: "",
            time: "",
            seats: [], 
            passengers: [] 
        };

        // --- カレンダー用状態変数 ---
        const realToday = new Date(); 
        let displayYear = realToday.getFullYear(); 
        let displayMonth = realToday.getMonth();
        
        // --- 初期化 ---
        window.onload = function() {
            renderCalendar();
            renderSeats();
            calcEndTimes(); 
        };
        
        // --- STEP 1: カレンダー & 時間 ---
        function changeMonth(diff) {
            displayMonth += diff;
            if (displayMonth > 11) { displayMonth = 0; displayYear++; } 
            else if (displayMonth < 0) { displayMonth = 11; displayYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            document.getElementById('calMonth').innerText = `${displayYear}年 ${displayMonth + 1}月`;
            const grid = document.getElementById('calGrid');
            grid.innerHTML = ""; 

            const btnPrev = document.getElementById('btnPrevMonth');
            const isCurrentMonth = (displayYear === realToday.getFullYear() && displayMonth === realToday.getMonth());
            
            if (displayYear < realToday.getFullYear() || (displayYear === realToday.getFullYear() && displayMonth <= realToday.getMonth())) {
                 btnPrev.disabled = true;
            } else {
                 btnPrev.disabled = false;
            }

            const firstDayObj = new Date(displayYear, displayMonth, 1);
            const startDayOfWeek = firstDayObj.getDay(); 
            const lastDay = new Date(displayYear, displayMonth + 1, 0).getDate();

            for (let i = 0; i < startDayOfWeek; i++) {
                const emptyDiv = document.createElement('div');
                emptyDiv.className = 'cal-cell empty';
                grid.appendChild(emptyDiv);
            }

            for (let i = 1; i <= lastDay; i++) {
                const d = document.createElement('div');
                d.className = 'cal-cell';
                d.innerText = i;

                if (isCurrentMonth && i < realToday.getDate()) {
                    d.classList.add('disabled');
                } else {
                    d.onclick = function() {
                        document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
                        d.classList.add('selected');
                        const mStr = String(displayMonth + 1).padStart(2, '0');
                        const dStr = String(i).padStart(2, '0');
                        bookingData.date = `${displayYear}-${mStr}-${dStr}`;
                        checkStep1();
                    };
                }
                grid.appendChild(d);
            }
        }

        function selectTime(el, time) {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            bookingData.time = time;
            checkStep1();
        }

        function checkStep1() {
            const btn = document.getElementById('btnStep1');
            btn.disabled = !(bookingData.date && bookingData.time);
        }

        function calcEndTimes() {
            const btns = document.querySelectorAll('.time-btn');
            btns.forEach(btn => {
                const startStr = btn.dataset.start;
                const duration = parseInt(btn.dataset.duration); 
                if (!startStr || isNaN(duration)) return;
                const [h, m] = startStr.split(':').map(Number);
                const date = new Date();
                date.setHours(h);
                date.setMinutes(m + duration);
                const endH = String(date.getHours()).padStart(2, '0');
                const endM = String(date.getMinutes()).padStart(2, '0');
                const endSpan = btn.querySelector('.t-end');
                endSpan.innerText = `~ ${endH}:${endM}`;
            });
        }

        // --- STEP 2: 座席 ---
        function renderSeats() {
            const map = document.getElementById('seatMap');
            const rows = ['A', 'B', 'C', 'D'];
            const cols = [1, 2, 3, 4, 5, 6, 7, 8];
            rows.forEach(row => {
                cols.forEach(col => {
                    const id = row + col;
                    const s = document.createElement('div');
                    s.className = 'seat';
                    s.onclick = () => toggleSeat(s, id);
                    map.appendChild(s);
                });
            });
        }

        function toggleSeat(el, id) {
            if (bookingData.seats.includes(id)) {
                bookingData.seats = bookingData.seats.filter(s => s !== id);
                el.classList.remove('selected');
            } else {
                if (bookingData.seats.length >= 4) return alert("一度に予約できるのは4席までです");
                bookingData.seats.push(id);
                el.classList.add('selected');
            }
            updateSeatCards();
            document.getElementById('btnStep2').disabled = bookingData.seats.length === 0;
            bookingData.needFormUpdate = true;
        }

        function updateSeatCards() {
            for (let i = 0; i < 4; i++) {
                const slot = document.getElementById(`seat-slot-${i}`);
                const seatId = bookingData.seats[i]; 
                if (seatId) {
                    slot.innerText = seatId;
                    slot.classList.add('filled');
                } else {
                    slot.innerText = "未選択";
                    slot.classList.remove('filled');
                }
            }
        }

        // --- 画面遷移 ---
        function goStep(step) {
            if (step === 3 && bookingData.needFormUpdate) {
                renderPassengerForms();
                calcTotal(); 
                bookingData.needFormUpdate = false;
            }

            // フッター表示制御
            const footer = document.getElementById('fixedFooter');
            if (step === 3) {
                footer.style.display = 'flex';
            } else {
                footer.style.display = 'none';
            }

            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
        }

        // --- STEP 3: フォーム生成 ---
        function renderPassengerForms() {
            const container = document.getElementById('passengerForms');
            container.innerHTML = "";
            
            bookingData.seats.forEach((seat) => {
                const html = `
                <div class="ticket-card">
                    <div class="seat-badge">${seat}</div>
                    <div class="form-group">
                        <div class="form-row">
                            <input type="text" class="inp-name" placeholder="お名前" required>
                            <select class="inp-member" onchange="calcTotal()">
                                <option value="0">非会員</option>
                                <option value="1">会員</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <input type="number" class="inp-age" placeholder="年齢" onchange="calcTotal()" required>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // --- API計算 ---
        async function calcTotal() {
            const names = document.querySelectorAll('.inp-name');
            const ages = document.querySelectorAll('.inp-age');
            const members = document.querySelectorAll('.inp-member');
            const coupon = document.getElementById('couponInput').value;
            
            const ageList = [];
            const memberList = [];
            let allFilled = true;

            ages.forEach((el, i) => {
                if (!el.value) allFilled = false;
                ageList.push(parseInt(el.value) || 0);
                memberList.push(parseInt(members[i].value));
            });

            if (!allFilled) return; 

            try {
                const res = await fetch('/api/calc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        movie_id: "{{ movie.id }}",
                        ages: ageList,
                        is_members: memberList,
                        coupon_code: coupon
                    })
                });
                
                const data = await res.json();
                
                const errorBox = document.getElementById('errorMsg');
                const priceBox = document.getElementById('totalPriceDisplay');
                const discountBox = document.getElementById('discountDisplay');
                const btn = document.getElementById('btnSubmit');

                if (data.status === 'error') {
                    errorBox.innerText = data.message;
                    errorBox.style.display = 'block';
                    priceBox.innerText = "---";
                    discountBox.innerText = "";
                    btn.disabled = true; 
                    btn.style.backgroundColor = "#ccc";
                } else {
                    errorBox.style.display = 'none';
                    priceBox.innerText = `¥${data.total_price.toLocaleString()}`;
                    if (data.discount > 0) {
                         discountBox.innerText = `(クーポン値引 -¥${data.discount})`;
                    } else {
                         discountBox.innerText = "";
                    }
                    btn.disabled = false;
                    btn.style.backgroundColor = "#00b894";
                }

            } catch (e) {
                console.error(e);
            }
        }

        // --- 送信 ---
        function submitOrder() {
            const form = document.getElementById('finalForm');
            document.getElementById('postDate').value = `${bookingData.date} ${bookingData.time}`;
            document.getElementById('postSeat').value = bookingData.seats.join(",");
            
            const names = document.querySelectorAll('.inp-name');
            const ages = document.querySelectorAll('.inp-age');
            const members = document.querySelectorAll('.inp-member');
            
            for(let n of names) {
                if(!n.value) return alert("お名前を入力してください");
            }

            names.forEach(el => addHidden(form, "names", el.value));
            ages.forEach(el => addHidden(form, "ages", el.value));
            members.forEach(el => addHidden(form, "is_members", el.value));
            
            form.submit();
        }

        function addHidden(form, name, value) {
            const i = document.createElement('input');
            i.type = 'hidden';
            i.name = name;
            i.value = value;
            form.appendChild(i);
        }
    </script>
</body>
</html>
