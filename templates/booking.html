<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約 - {{ movie.title }}</title>
    <link rel="stylesheet" href="/static/css/booking.css">
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1 class="movie-title">予約: {{ movie.title }}</h1>
            <a href="/" class="close-btn">×</a>
        </div>

        <!-- STEP 1: 日時選択 -->
        <div id="step1" class="step-content active">
            <h2>日付をお選びください</h2>
            <div class="calendar-wrapper">
                <div class="calendar-header">
                    <button class="cal-nav-btn" id="btnPrevMonth" onclick="changeMonth(-1)">&#10094;</button>
                    <span id="calMonth"></span>
                    <button class="cal-nav-btn" id="btnNextMonth" onclick="changeMonth(1)">&#10095;</button>
                </div>
                
                <div class="calendar-weekdays">
                    <div class="weekday">日</div>
                    <div class="weekday">月</div>
                    <div class="weekday">火</div>
                    <div class="weekday">水</div>
                    <div class="weekday">木</div>
                    <div class="weekday">金</div>
                    <div class="weekday">土</div>
                </div>

                <div class="calendar-grid" id="calGrid">
                    <!-- JSで生成 -->
                </div>
            </div>

            <h2>時間をお選びください</h2>
            <div class="time-list">
                {% for time in movie.start_time %}
                <div class="time-btn" 
                     onclick="selectTime(this, '{{ time }}')"
                     data-start="{{ time }}" 
                     data-duration="{{ movie.duration }}">
                    <span class="t-start">{{ time }}</span>
                    <span class="t-end"></span> 
                </div>
                {% endfor %}
            </div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="location.href='/'">戻る</button>
                <button class="btn btn-next" id="btnStep1" disabled onclick="goStep(2)">次の画面へ</button>
            </div>
        </div>

        <!-- STEP 2: 座席選択 -->
        <div id="step2" class="step-content">
            <h2>座席をお選びください（最大4席）</h2>
            <div class="screen">SCREEN</div>
            <div class="seat-map" id="seatMap">
                <!-- JSで生成 -->
            </div>
            <div class="seat-slots-container">
                <div class="seat-slot-card" id="seat-slot-0">未選択</div>
                <div class="seat-slot-card" id="seat-slot-1">未選択</div>
                <div class="seat-slot-card" id="seat-slot-2">未選択</div>
                <div class="seat-slot-card" id="seat-slot-3">未選択</div>
            </div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="goStep(1)">前の画面に戻る</button>
                <button class="btn btn-next" id="btnStep2" disabled onclick="goStep(3)">次の画面へ</button>
            </div>
        </div>

        <!-- STEP 3: 券種入力 -->
        <div id="step3" class="step-content">
            <h2>券種を入力してください</h2>
            
            <div id="passengerForms" class="ticket-form-list">
                <!-- JSで動的にフォーム生成 -->
            </div>

            <div class="summary-area">
                <div class="coupon-row">
                    <input type="text" id="couponInput" placeholder="クーポンコードをお持ちの方はこちら">
                    <button class="coupon-btn" onclick="calcTotal()">適用</button>
                </div>
                <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.2); margin: 20px 0;">
                
                <div class="total-row">
                    <span>お支払い合計</span>
                    <div style="text-align: right;">
                        <!-- 小計（割引前）: 最初は隠しておく -->
                        <div class="subtotal-price" id="subtotalDisplay" style="display:none;"></div>
                        <!-- 最終金額 -->
                        <div class="total-price" id="totalPriceDisplay">¥0</div>
                        <!-- クーポン情報 -->
                        <div class="discount-info" id="discountDisplay"></div>
                    </div>
                </div>
                <div class="error-msg" id="errorMsg"></div>
            </div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="goStep(2)">前の画面に戻る</button>
                <button class="btn btn-next" id="btnSubmit" onclick="submitOrder()">予約確定</button>
            </div>
        </div>
    </div>

    <!-- 送信用隠しフォーム -->
    <form id="finalForm" action="/result" method="post" style="display:none;">
        <input type="hidden" name="movie_id" value="{{ movie.id }}">
        <input type="hidden" name="date" id="postDate">
        <input type="hidden" name="seat" id="postSeat">
        <input type="hidden" name="coupon_code" id="postCoupon">
    </form>

    <script>
        const MOVIE_ID = "{{ movie.id }}";
    </script>
    <script src="/static/js/booking.js"></script>
</body>
</html>
