<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>予約 - {{ movie.title }}</title>
    <style>
        /* --- 共通設定 --- */
        body { margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; background-color: #f0f2f5; color: #333; }
        
        /* コンテナ */
        .container { max-width: 800px; margin: 40px auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; }
        
        /* ヘッダー */
        .header { background: #fff; padding: 20px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .movie-title { margin: 0; font-size: 1.2rem; }
        .close-btn { cursor: pointer; font-size: 1.5rem; color: #999; text-decoration: none; }

        /* ステップ表示エリア */
        .step-content { display: none; padding: 30px; animation: fadeIn 0.3s ease; }
        .step-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        h2 { text-align: center; margin-bottom: 30px; font-size: 1.1rem; color: #555; }

        /* --- STEP 1: 日時選択 --- */
        .calendar-wrapper { margin-bottom: 30px; background: #f9f9f9; padding: 20px; border-radius: 8px; }
        .calendar-header { text-align: center; margin-bottom: 15px; font-weight: bold; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-cell { padding: 10px; border-radius: 4px; cursor: pointer; transition: 0.2s; }
        .cal-cell:hover:not(.empty) { background: #e0e0e0; }
        .cal-cell.selected { background: #333; color: #fff; }
        .cal-cell.empty { cursor: default; }

        .time-list { display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; }
        .time-btn { padding: 15px 30px; border: 2px solid #ddd; background: #fff; border-radius: 8px; cursor: pointer; font-size: 1.1rem; transition: 0.2s; }
        .time-btn:hover { border-color: #999; }
        .time-btn.selected { border-color: #007bff; color: #007bff; background: #e6f0ff; font-weight: bold; }

        /* --- STEP 2: 座席選択 --- */
        .screen { height: 30px; background: #ccc; margin-bottom: 40px; border-radius: 4px; text-align: center; color: #fff; line-height: 30px; font-size: 0.8rem; letter-spacing: 5px; }
        .seat-map { display: grid; grid-template-columns: repeat(8, 1fr); gap: 10px; max-width: 500px; margin: 0 auto; }
        .seat { aspect-ratio: 1; background: #e0e0e0; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .seat:hover { background: #d0d0d0; transform: scale(1.05); }
        .seat.selected { background: #4cd137; box-shadow: 0 0 10px rgba(76, 209, 55, 0.4); }
        .seat-info { text-align: center; margin-top: 20px; min-height: 24px; color: #007bff; font-weight: bold; }

        /* --- STEP 3: 入力 & 計算 --- */
        .ticket-form-list { display: flex; flex-direction: column; gap: 20px; }
        .ticket-card { display: flex; align-items: center; background: #f8f9fa; padding: 20px; border-radius: 8px; border-left: 5px solid #4cd137; gap: 20px; }
        .seat-badge { width: 60px; height: 60px; background: #fff; border: 2px solid #4cd137; border-radius: 8px; display: flex; justify-content: center; align-items: center; font-weight: bold; font-size: 1.2rem; color: #4cd137; }
        
        .form-group { flex: 1; }
        .form-row { display: flex; gap: 15px; margin-bottom: 10px; }
        .form-row:last-child { margin-bottom: 0; }
        
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; box-sizing: border-box; }
        
        /* 合計エリア */
        .summary-area { background: #2d3436; color: #fff; padding: 30px; margin-top: 30px; border-radius: 8px; }
        .coupon-row { display: flex; gap: 10px; margin-bottom: 20px; }
        .coupon-row input { background: #fff; color: #333; border: none; }
        .coupon-btn { background: #636e72; color: #fff; border: none; padding: 0 20px; border-radius: 6px; cursor: pointer; }
        
        .total-row { display: flex; justify-content: space-between; align-items: flex-end; font-size: 1.2rem; }
        .total-price { font-size: 2rem; font-weight: bold; }
        .error-msg { color: #ff7675; font-size: 0.9rem; margin-top: 10px; display: none; }

        /* ナビゲーションボタン */
        .nav-area { display: flex; justify-content: center; gap: 20px; padding: 30px; border-top: 1px solid #eee; }
        .btn { padding: 12px 30px; border-radius: 30px; border: none; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .btn-prev { background: #dfe6e9; color: #2d3436; }
        .btn-next { background: #2d3436; color: #fff; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

    </style>
</head>
<body>

    <div class="container">
        <!-- ヘッダー -->
        <div class="header">
            <h1 class="movie-title">予約: {{ movie.title }}</h1>
            <a href="/" class="close-btn">×</a>
        </div>

        <!-- STEP 1: 日時選択 -->
        <div id="step1" class="step-content active">
            <h2>日付をお選びください</h2>
            <div class="calendar-wrapper">
                <div class="calendar-header" id="calMonth"></div>
                <div class="calendar-grid" id="calGrid">
                    <!-- JSで生成 -->
                </div>
            </div>

            <h2>時間をお選びください</h2>
            <div class="time-list">
                <!-- Pythonから渡されたスケジュールを展開 -->
                {% for time in movie.schedules %}
                <div class="time-btn" onclick="selectTime(this, '{{ time }}')">{{ time }}</div>
                {% endfor %}
            </div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="location.href='/'">戻る</button>
                <button class="btn btn-next" id="btnStep1" disabled onclick="goStep(2)">次の画面へ</button>
            </div>
        </div>

        <!-- STEP 2: 座席選択 -->
        <div id="step2" class="step-content">
            <h2>座席をお選びください（最大4席）</h2>
            <div class="screen">SCREEN</div>
            <div class="seat-map" id="seatMap">
                <!-- JSで生成 -->
            </div>
            <div class="seat-info" id="seatInfo">未選択</div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="goStep(1)">前の画面に戻る</button>
                <button class="btn btn-next" id="btnStep2" disabled onclick="goStep(3)">次の画面へ</button>
            </div>
        </div>

        <!-- STEP 3: 券種入力 -->
        <div id="step3" class="step-content">
            <h2>券種を入力してください</h2>
            
            <div id="passengerForms" class="ticket-form-list">
                <!-- JSで動的にフォーム生成 -->
            </div>

            <div class="summary-area">
                <div class="coupon-row">
                    <input type="text" id="couponInput" placeholder="クーポンコード">
                    <button class="coupon-btn" onclick="calcTotal()">適用</button>
                </div>
                <div class="total-row">
                    <span>合計</span>
                    <span class="total-price" id="totalPriceDisplay">¥0</span>
                </div>
                <div class="error-msg" id="errorMsg"></div>
            </div>

            <div class="nav-area">
                <button class="btn btn-prev" onclick="goStep(2)">前の画面に戻る</button>
                <button class="btn btn-next" id="btnSubmit" onclick="submitOrder()">予約確定</button>
            </div>
        </div>
    </div>

    <!-- 送信用隠しフォーム -->
    <form id="finalForm" action="/result" method="post" style="display:none;">
        <input type="hidden" name="movie_id" value="{{ movie.id }}">
        <input type="hidden" name="date" id="postDate">
        <input type="hidden" name="seat" id="postSeat">
        <!-- 名前、年齢、会員はJSで動的にinputタグを追加して送信します -->
    </form>

    <script>
        // --- データ保持用 ---
        let bookingData = {
            date: "",
            time: "",
            seats: [], // ["A1", "B2"]
            passengers: [] // {name, age, is_member}
        };

        // --- 初期化 ---
        window.onload = function() {
            renderCalendar();
            renderSeats();
        };

        // --- STEP 1: カレンダー & 時間 ---
        function renderCalendar() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            const lastDay = new Date(year, month + 1, 0).getDate();
            
            document.getElementById('calMonth').innerText = `${year}年 ${month + 1}月`;
            const grid = document.getElementById('calGrid');
            
            for (let i = 1; i <= lastDay; i++) {
                const d = document.createElement('div');
                d.className = 'cal-cell';
                d.innerText = i;
                d.onclick = function() {
                    document.querySelectorAll('.cal-cell').forEach(c => c.classList.remove('selected'));
                    d.classList.add('selected');
                    bookingData.date = `${year}-${month+1}-${i}`;
                    checkStep1();
                };
                grid.appendChild(d);
            }
        }

        function selectTime(el, time) {
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
            bookingData.time = time;
            checkStep1();
        }

        function checkStep1() {
            const btn = document.getElementById('btnStep1');
            btn.disabled = !(bookingData.date && bookingData.time);
        }

        // --- STEP 2: 座席 ---
        function renderSeats() {
            const map = document.getElementById('seatMap');
            const rows = ['A', 'B', 'C', 'D'];
            const cols = [1, 2, 3, 4, 5, 6, 7, 8];
            
            rows.forEach(row => {
                cols.forEach(col => {
                    const id = row + col;
                    const s = document.createElement('div');
                    s.className = 'seat';
                    s.onclick = () => toggleSeat(s, id);
                    map.appendChild(s);
                });
            });
        }

        function toggleSeat(el, id) {
            if (bookingData.seats.includes(id)) {
                // 解除
                bookingData.seats = bookingData.seats.filter(s => s !== id);
                el.classList.remove('selected');
            } else {
                // 追加 (最大4席)
                if (bookingData.seats.length >= 4) return alert("一度に予約できるのは4席までです");
                bookingData.seats.push(id);
                el.classList.add('selected');
            }
            
            // 表示更新
            document.getElementById('seatInfo').innerText = bookingData.seats.length > 0 ? bookingData.seats.join(", ") : "未選択";
            document.getElementById('btnStep2').disabled = bookingData.seats.length === 0;
            
            // フォーム再生成フラグ
            bookingData.needFormUpdate = true;
        }

        // --- 画面遷移 ---
        function goStep(step) {
            // STEP 3に行く直前にフォームを生成
            if (step === 3 && bookingData.needFormUpdate) {
                renderPassengerForms();
                calcTotal(); // 初期計算（0円）
                bookingData.needFormUpdate = false;
            }

            document.querySelectorAll('.step-content').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
        }

        // --- STEP 3: フォーム生成 ---
        function renderPassengerForms() {
            const container = document.getElementById('passengerForms');
            container.innerHTML = "";
            
            bookingData.seats.forEach((seat, index) => {
                const html = `
                <div class="ticket-card">
                    <div class="seat-badge">${seat}</div>
                    <div class="form-group">
                        <div class="form-row">
                            <input type="text" class="inp-name" placeholder="お名前" required>
                            <select class="inp-member" onchange="calcTotal()">
                                <option value="0">非会員</option>
                                <option value="1">会員</option>
                            </select>
                        </div>
                        <div class="form-row">
                            <input type="number" class="inp-age" placeholder="年齢" onchange="calcTotal()" required>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', html);
            });
        }

        // --- API計算 ---
        async function calcTotal() {
            // データ収集
            const names = document.querySelectorAll('.inp-name'); // 送信時は使う
            const ages = document.querySelectorAll('.inp-age');
            const members = document.querySelectorAll('.inp-member');
            const coupon = document.getElementById('couponInput').value;
            
            const ageList = [];
            const memberList = [];
            
            let allFilled = true;

            ages.forEach((el, i) => {
                if (!el.value) allFilled = false;
                ageList.push(parseInt(el.value) || 0);
                memberList.push(parseInt(members[i].value));
            });

            if (!allFilled) return; // 入力が揃うまで計算しない

            // API通信
            try {
                const res = await fetch('/api/calc', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        movie_id: "{{ movie.id }}",
                        ages: ageList,
                        is_members: memberList,
                        coupon_code: coupon
                    })
                });
                
                const data = await res.json();
                
                const errorBox = document.getElementById('errorMsg');
                const priceBox = document.getElementById('totalPriceDisplay');
                const btn = document.getElementById('btnSubmit');

                if (data.status === 'error') {
                    errorBox.innerText = data.message;
                    errorBox.style.display = 'block';
                    priceBox.innerText = "---";
                    btn.disabled = true; // 予約させない
                    btn.style.backgroundColor = "#ccc";
                } else {
                    errorBox.style.display = 'none';
                    priceBox.innerText = `¥${data.total_price.toLocaleString()}`;
                    if (data.discount > 0) {
                         priceBox.innerText += ` (値引 -¥${data.discount})`;
                    }
                    btn.disabled = false;
                    btn.style.backgroundColor = "#2d3436";
                }

            } catch (e) {
                console.error(e);
            }
        }

        // --- 送信 ---
        function submitOrder() {
            const form = document.getElementById('finalForm');
            
            // 隠しフィールドセット
            document.getElementById('postDate').value = `${bookingData.date} ${bookingData.time}`;
            document.getElementById('postSeat').value = bookingData.seats.join(",");
            
            // 動的input追加
            const names = document.querySelectorAll('.inp-name');
            const ages = document.querySelectorAll('.inp-age');
            const members = document.querySelectorAll('.inp-member');
            
            // 名前チェック
            for(let n of names) {
                if(!n.value) return alert("お名前を入力してください");
            }

            names.forEach(el => addHidden(form, "names", el.value));
            ages.forEach(el => addHidden(form, "ages", el.value));
            members.forEach(el => addHidden(form, "is_members", el.value));
            
            form.submit();
        }

        function addHidden(form, name, value) {
            const i = document.createElement('input');
            i.type = 'hidden';
            i.name = name;
            i.value = value;
            form.appendChild(i);
        }

    </script>
</body>
</html>
